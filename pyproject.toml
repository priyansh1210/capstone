[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amm"
version = "0.1.0"
description = "Autonomous Model Maintenance under Concept Drift (bike-demand capstone)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.2.5,<3",
  "pandas>=3.0,<3.2",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.14.1,<2",
  "river>=0.26,<0.27",
  "streamlit>=1.56,<1.57",
  "plotly>=6.3,<7",
  "joblib>=1.5,<2",
  "pyarrow>=21,<22",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.10,<3.11",
  "threadpoolctl>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
amm = "amm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
